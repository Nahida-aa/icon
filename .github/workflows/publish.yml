name: Release Packages

on:
  push:
    tags:
      - 'v*' # 当你推一个 v1.0.0 这样的 tag 时触发

permissions:
  contents: write
  id-token: write # 必须：用于 NPM OIDC 认证，免去 2FA

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 安装 Bun (用于极速安装依赖)
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 2. 安装依赖
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # 3. 同步版本号
      - name: Sync Versions
        run: |
          # 从 v1.2.3 中提取 1.2.3
          VERSION=${GITHUB_REF#refs/tags/v}
          bun scripts/sync-version.m.ts -- $VERSION

      # 5. 构建所有包
      - name: Build
        run: bun run build # 或者使用 turbo: bun x turbo build

      # 6. 发布到 NPM 
      # Bun 会自动处理 workspace:* 协议
      - name: Publish
        run:  |
          # 如果是 Monorepo, 你可以进入各子包目录发布, 或者写个简单的循环
          # 目前 bun publish 还没像 pnpm 那样完善的递归发布命令
          # 这是一个循环发布的示例：
          # 遍历发布所有非私有包
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              if ! grep -q '"private": true' "$dir/package.json"; then
                cd $dir
                bun publish --access public
                cd ../..
              fi
            fi
          done
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true # 开启出处证明，配合 id-token 权限
